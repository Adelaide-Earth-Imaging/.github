        C160 350 315 355 455 378
        C600 401 675 445 800 452
        C930 459 1015 407 1130 390
        C1245 373 1345 401 1440 433
        C1530 463 1610 467 1705 429
        C1810 388 1900 377 2010 382
        C2140 389 2265 367 2400 373
      "/>

      <path d="
        M0 425
        C155 388 310 392 450 416
        C595 441 680 485 815 492
        C940 499 1035 451 1145 431
        C1260 411 1355 440 1455 475
        C1550 507 1630 506 1720 469
        C1825 427 1910 420 2020 425
        C2140 432 2270 409 2400 414
