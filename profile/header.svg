<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 2400 600"
     width="2400"
     height="600"
     role="img"
     aria-labelledby="title desc">

  <title id="title">Adelaide Earth Imaging</title>
  <desc id="desc">Adelaide Earth Imaging research group banner.</desc>

  <defs>

    <!-- Background -->
    <linearGradient id="background"
                    x1="0%" y1="0%"
                    x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fbfcfd"/>
    </linearGradient>

    <!-- Main subsurface colour field -->
    <linearGradient id="earthBase"
                    x1="0%" y1="0%"
                    x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#20bce8"/>
      <stop offset="18%"  stop-color="#22b9e5"/>
      <stop offset="32%"  stop-color="#38c5df"/>
      <stop offset="50%"  stop-color="#168dde"/>
      <stop offset="67%"  stop-color="#1266d0"/>
      <stop offset="83%"  stop-color="#284bc4"/>
      <stop offset="100%" stop-color="#6631c3"/>
    </linearGradient>

    <!-- Depth shading -->
    <linearGradient id="depthShade"
                    x1="0%" y1="0%"
                    x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="60%"  stop-color="#213eb5" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#5421a5" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Conductive / warm structures -->
    <radialGradient id="hot1"
                    cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ef1747"/>
      <stop offset="25%"  stop-color="#ff3c32"/>
      <stop offset="50%"  stop-color="#ff8b2c"/>
      <stop offset="72%"  stop-color="#ffd34e"/>
      <stop offset="100%" stop-color="#8bd6bd" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="hot2"
                    cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ff632f"/>
      <stop offset="35%"  stop-color="#ffa52e"/>
      <stop offset="65%"  stop-color="#e6d74e"/>
      <stop offset="100%" stop-color="#69d0c5" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="warm"
                    cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#d4dc59"/>
      <stop offset="50%"  stop-color="#8bd5a8"/>
      <stop offset="100%" stop-color="#42c7d5" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="deepPurple"
                    cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#7b19ba" stop-opacity="0.95"/>
      <stop offset="55%"  stop-color="#5331bf" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#274cc4" stop-opacity="0"/>
    </radialGradient>

    <!-- Everything below the topographic surface -->
    <clipPath id="belowGround">
      <path d="
        M0 305
        C90 305 155 301 220 300
        C290 299 350 289 405 271
        C440 259 467 244 493 249
        C525 255 549 275 585 286
        C632 300 690 304 765 304
        C835 304 895 299 947 280
        C988 265 1024 247 1061 252
        C1098 257 1128 277 1167 288
        C1213 301 1273 305 1343 305
        C1430 305 1510 304 1582 296
        C1632 291 1680 277 1721 280
        C1757 283 1783 296 1825 301
        C1900 306 1990 305 2070 305
        C2170 305 2280 306 2400 305
        L2400 600
        L0 600
        Z"/>
    </clipPath>

  </defs>


  <!-- Background -->
  <rect x="0"
        y="0"
        width="2400"
        height="600"
        fill="url(#background)"/>


  <!-- ====================================================== -->
  <!-- HEADER -->
  <!-- ====================================================== -->

  <text x="110"
        y="165"
        fill="#102d50"
        font-family="Inter, Helvetica Neue, Arial, sans-serif"
        font-size="72"
        font-weight="300"
        letter-spacing="15">
    ADELAIDE EARTH IMAGING
  </text>

  <line x1="1730"
        y1="48"
        x2="1730"
        y2="230"
        stroke="#294c6c"
        stroke-width="2"/>

  <g fill="#315575"
     font-family="Inter, Helvetica Neue, Arial, sans-serif"
     font-size="21"
     font-weight="400"
     letter-spacing="4.5">

    <text x="1790" y="70">MAGNETOTELLURICS</text>
    <text x="1790" y="110">PASSIVE SEISMIC</text>
    <text x="1790" y="150">POTENTIAL FIELDS</text>
    <text x="1790" y="190">GEOPHYSICAL INVERSION</text>
    <text x="1790" y="230">COMPUTATIONAL GEOPHYSICS</text>

  </g>


  <!-- ====================================================== -->
  <!-- SUBSURFACE -->
  <!-- ====================================================== -->

  <g clip-path="url(#belowGround)">

    <!-- Base model -->
    <rect x="0"
          y="240"
          width="2400"
          height="360"
          fill="url(#earthBase)"/>


    <!-- Large conductive structure -->
    <ellipse cx="700"
             cy="360"
             rx="400"
             ry="185"
             fill="url(#hot1)"/>

    <ellipse cx="820"
             cy="420"
             rx="275"
             ry="135"
             fill="#ff812b"
             opacity="0.35"/>


    <!-- Green / transitional domain -->
    <ellipse cx="1230"
             cy="420"
             rx="280"
             ry="125"
             fill="url(#warm)"
             opacity="0.78"/>


    <!-- Central cool structure -->
    <ellipse cx="1510"
             cy="365"
             rx="235"
             ry="170"
             fill="#0757c8"
             opacity="0.48"/>


    <!-- Right-hand warm structures -->
    <ellipse cx="1875"
             cy="390"
             rx="260"
             ry="100"
             fill="url(#hot2)"
             opacity="0.95"/>

    <ellipse cx="2210"
             cy="420"
             rx="250"
             ry="110"
             fill="url(#hot2)"
             opacity="0.90"/>


    <!-- Deep purple domain -->
    <ellipse cx="2050"
             cy="575"
             rx="450"
             ry="185"
             fill="url(#deepPurple)"/>

    <ellipse cx="250"
             cy="590"
             rx="320"
             ry="145"
             fill="#6245c4"
             opacity="0.28"/>


    <!-- Depth shading -->
    <rect x="0"
          y="300"
          width="2400"
          height="300"
          fill="url(#depthShade)"/>


    <!-- ==================================================== -->
    <!-- MODEL CONTOURS -->
    <!-- ==================================================== -->

    <g fill="none"
       stroke="#ffffff"
       stroke-width="1.4"
       opacity="0.52">

      <path d="
        M0 350
        C170 320 330 327 470 347
        C610 368 670 400 790 408
        C920 418 1020 365 1135 353
        C1255 341 1335 367 1430 395
        C1530 425 1600 430 1690 397
        C1800 355 1890 343 2010 348
        C2150 353 2260 335 2400 340"/>

      <path d="
        M0 385
        C160 350 315 355 455 378
        C600 401 675 445 800 452
        C930 459 1015 407 1130 390
        C1245 373 1345 401 1440 433
        C1530 463 1610 467 1705 429
        C1810 388 1900 377 2010 382
        C2140 389 2265 367 2400 373"/>

      <path d="
        M0 425
        C155 388 310 392 450 416
        C595 441 680 485 815 492
        C940 499 1035 451 1145 431
        C1260 411 1355 440 1455 475
        C1550 507 1630 506 1720 469
        C1825 427 1910 420 2020 425
        C2140 432 2270 409 2400 414"/>

      <path d="
        M0 470
        C160 431 310 438 455 463
        C600 489 700 527 825 535
        C955 543 1050 497 1160 478
        C1275 458 1370 485 1470 520
        C1570 554 1650 550 1740 516
        C1845 474 1935 467 2040 472
        C2160 479 2275 456 2400 460"/>

      <path d="
        M0 520
        C165 480 320 486 465 510
        C615 536 710 568 845 575
        C970 582 1070 545 1180 525
        C1300 503 1390 529 1490 560
        C1580 588 1670 590 1760 555
        C1860 516 1950 509 2055 515
        C2170 522 2280 501 2400 505"/>

    </g>


    <!-- Dashed interpreted structures -->
    <g fill="none"
       stroke="#ffffff"
       stroke-width="1.2"
       stroke-dasharray="8 9"
       opacity="0.38">

      <path d="
        M40 335
        C210 320 370 330 510 350
        C650 370 720 395 840 400
        C980 406 1060 372 1180 360"/>

      <path d="
        M1040 365
        C1200 340 1320 360 1430 395
        C1530 428 1615 435 1710 405
        C1830 366 1950 360 2080 370"/>

      <path d="
        M70 485
        C220 450 365 455 500 480
        C630 505 710 540 825 550"/>

      <path d="
        M1420 530
        C1540 570 1640 565 1740 530
        C1850 490 1970 487 2090 500
        C2200 512 2290 497 2370 495"/>

    </g>

  </g>


  <!-- ====================================================== -->
  <!-- TOPOGRAPHY -->
  <!-- ====================================================== -->

  <!-- Main terrain -->
  <path d="
    M0 305
    C90 305 155 301 220 300
    C290 299 350 289 405 271
    C440 259 467 244 493 249
    C525 255 549 275 585 286
    C632 300 690 304 765 304

    C835 304 895 299 947 280
    C988 265 1024 247 1061 252
    C1098 257 1128 277 1167 288
    C1213 301 1273 305 1343 305

    C1430 305 1510 304 1582 296
    C1632 291 1680 277 1721 280
    C1757 283 1783 296 1825 301

    C1900 306 1990 305 2070 305
    C2170 305 2280 306 2400 305

    L2400 318
    L0 318
    Z"
    fill="#87966d"/>


  <!-- Terrain colour variation -->
  <path d="
    M260 300
    C325 295 375 279 415 264
    C450 251 472 246 493 249
    C520 254 545 271 580 285
    C535 277 500 273 460 278
    C410 284 355 297 260 304
    Z"
    fill="#b5a373"
    opacity="0.75"/>

  <path d="
    M900 299
    C955 286 1000 261 1045 253
    C1085 247 1115 269 1155 286
    C1110 278 1075 275 1035 281
    C990 288 950 299 900 304
    Z"
    fill="#b6a271"
    opacity="0.80"/>

  <path d="
    M1510 303
    C1580 299 1640 282 1695 280
    C1735 278 1765 293 1810 301
    C1750 294 1690 295 1620 303
    Z"
    fill="#718f70"
    opacity="0.80"/>


  <!-- Topographic ridge -->
  <path d="
    M0 305
    C90 305 155 301 220 300
    C290 299 350 289 405 271
    C440 259 467 244 493 249
    C525 255 549 275 585 286
    C632 300 690 304 765 304

    C835 304 895 299 947 280
    C988 265 1024 247 1061 252
    C1098 257 1128 277 1167 288
    C1213 301 1273 305 1343 305

    C1430 305 1510 304 1582 296
    C1632 291 1680 277 1721 280
    C1757 283 1783 296 1825 301

    C1900 306 1990 305 2070 305
    C2170 305 2280 306 2400 305"
    fill="none"
    stroke="#263c4a"
    stroke-width="2"/>


  <!-- Fine terrain structure -->
  <g fill="none"
     stroke="#415966"
     stroke-width="0.9"
     opacity="0.42">

    <path d="
      M285 296
      C350 288 400 269 447 258
      C480 251 510 262 550 280"/>

    <path d="
      M340 290
      C395 279 435 263 468 256
      C500 254 525 268 560 282"/>

    <path d="
      M925 292
      C975 279 1015 262 1050 258
      C1085 258 1110 272 1140 283"/>

    <path d="
      M1570 297
      C1630 290 1670 282 1705 285
      C1740 287 1760 296 1795 300"/>

  </g>

</svg>
